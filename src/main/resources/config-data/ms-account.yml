# Configuration for ms-account
server:
  port: 8082

spring:
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/db_pivot_account}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/db_pivot_account}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: ${spring.application.name}-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.pe.pivot.account.infrastructure.adapter.in.messaging.dto.YankiPaymentRequestedEvent

application:
  account-rules:
    savings-max-monthly-movements: ${SAVINGS_MAX_MOVEMENTS:5}
    checking-default-maintenance-fee: ${CHECKING_MAINTENANCE_FEE:15.00}
    fixed-term-default-movement-day: ${FIXED_TERM_MOVEMENT_DAY:28}
    default-min-opening-amount: ${DEFAULT_MIN_OPENING_AMOUNT:0.00}
    vip-min-opening-amount: ${VIP_MIN_OPENING_AMOUNT:500.00}
    vip-minimum-daily-average: ${VIP_MIN_DAILY_AVERAGE:500.00}
    max-free-monthly-transactions: ${MAX_FREE_TRANSACTIONS:3}
    default-transaction-commission: ${DEFAULT_TX_COMMISSION:5.00}
  clients:
    customer-service:
      url: ${CUSTOMER_SERVICE_URL:http://localhost:8081/api/v1/customers}
    credit-service:
      url: ${CREDIT_SERVICE_URL:http://localhost:8083/api/v1/credits}
  kafka-topics:
    yanki-payment-requested: yanki.payment.requested
    yanki-payment-result: yanki.payment.result
    transaction-recorded: yanki.transaction.recorded

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  timelimiter:
    configs:
      default:
        timeoutDuration: 2s
        cancelRunningFuture: true

logging:
  level:
    root: INFO
    com.pe.pivot.account: DEBUG
