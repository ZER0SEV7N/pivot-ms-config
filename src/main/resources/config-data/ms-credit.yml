# Configuration for ms-credit microservises
server:
  port: 8083

spring:
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/db_pivot_credit}

application:
  credit-rules:
    default-personal-loan-rate: ${PERSONAL_LOAN_RATE:16.50}
    default-business-loan-rate: ${BUSINESS_LOAN_RATE:12.00}
    default-credit-card-rate: ${CREDIT_CARD_RATE:35.90}
    default-payment-due-day: ${DEFAULT_PAYMENT_DUE_DAY:15}
  clients:
    customer-service:
      url: ${CUSTOMER_SERVICE_URL:http://localhost:8081/api/v1/customers}

logging:
  level:
    root: INFO
    com.pe.pivot.credit: DEBUG

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  timelimiter:
    configs:
      default:
        timeoutDuration: 2s
        cancelRunningFuture: true