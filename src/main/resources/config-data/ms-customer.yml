# Configuration for ms-customer microservice
server:
  port: 8081

spring:
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/db_pivot_customer}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/db_pivot_customer}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    root: INFO
    com.pe.pivot.customer: DEBUG

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true