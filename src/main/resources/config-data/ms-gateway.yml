server:
  port: 8080

spring:
  application:
    name: ms-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: ms-auth-route
          uri: lb://ms-auth
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker
                fallbackUri: forward:/fallback/ms-auth

        - id: ms-customer-route
          uri: lb://ms-customer
          predicates:
            - Path=/api/v1/customers/**
          filters:
            - name: CircuitBreaker
              args:
                name: customerServiceCircuitBreaker
                fallbackUri: forward:/fallback/ms-customer

        - id: ms-account-route
          uri: lb://ms-account
          predicates:
            - Path=/api/v1/accounts/**, /api/v1/debit-cards/**
          filters:
            - name: CircuitBreaker
              args:
                name: accountServiceCircuitBreaker
                fallbackUri: forward:/fallback/ms-account

        - id: ms-credit-route
          uri: lb://ms-credit
          predicates:
            - Path=/api/v1/credits/**
          filters:
            - name: CircuitBreaker
              args:
                name: creditServiceCircuitBreaker
                fallbackUri: forward:/fallback/ms-credit

        - id: ms-transaction-route
          uri: lb://ms-transaction
          predicates:
            - Path=/api/v1/transactions/**
          filters:
            - name: CircuitBreaker
              args:
                name: transactionServiceCircuitBreaker
                fallbackUri: forward:/fallback/ms-transaction

        - id: ms-yanki-route
          uri: lb://ms-yanki
          predicates:
            - Path=/api/v1/yanki/**
          filters:
            - name: CircuitBreaker
              args:
                name: yankiServiceCircuitBreaker
                fallbackUri: forward:/fallback/ms-yanki

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

application:
  security:
    jwt:
      enabled: ${JWT_AUTH_ENABLED:true}
      secret-key: ${jwt-secret-key:UGl2b3RCYW5rSldUU2lnbmluZ1NlY3JldEtleTIwMjZTaGExMjM0NTY3ODkw}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  timelimiter:
    configs:
      default:
        timeoutDuration: 2s
        cancelRunningFuture: true

logging:
  level:
    root: INFO
    com.pe.pivot.gateway: DEBUG