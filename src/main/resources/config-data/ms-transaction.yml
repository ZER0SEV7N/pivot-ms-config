# Configuration for ms-transaction microservices
server:
  port: 8084

spring:
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/db_pivot_transaction}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/db_pivot_transaction}
      host: localhost
      port: 27017
      database: db_pivot_transaction
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${spring.application.name}-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

application:
  transaction-rules:
    operation-prefix: ${OPERATION_PREFIX:OP-}
    default-fee: ${DEFAULT_TRANSACTION_FEE:0.00}
  clients:
    customer-service:
      url: ${CUSTOMER_SERVICE_URL:http://localhost:8081/api/v1/customers}
    account-service:
      url: ${ACCOUNT_SERVICE_URL:http://localhost:8082/api/v1/accounts}
    credit-service:
      url: ${CREDIT_SERVICE_URL:http://localhost:8083/api/v1/credits}
  kafka-topics:
    yanki-payment-requested: yanki.payment.requested
    yanki-payment-result: yanki.payment.result
    transaction-recorded: yanki.transaction.recorded

logging:
  level:
    root: INFO
    com.pe.pivot.transaction: DEBUG

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  timelimiter:
    configs:
      default:
        timeoutDuration: 2s
        cancelRunningFuture: true